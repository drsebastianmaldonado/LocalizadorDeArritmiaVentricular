<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>EKG Locator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-blue: #007AFF;
            --medical-teal: #0D9488;
            --soft-bg: #F8FAFC;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--soft-bg);
            -webkit-tap-highlight-color: transparent;
            color: #1E293B;
        }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Animaciones suaves */
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #E2E8F0;
        }
        .card-btn:active {
            transform: scale(0.98);
            background-color: #F1F5F9;
        }
        .progress-bar {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-white border-b border-slate-200 safe-top sticky top-0 z-50 shadow-sm">
        <div class="px-5 py-4 flex justify-between items-center max-w-2xl mx-auto">
            <div>
                <h1 class="text-xl font-extrabold tracking-tight text-slate-900">
                    EKG <span class="text-blue-600">Locator</span><span class="text-xs font-medium ml-1 text-slate-400">PRO</span>
                </h1>
                <p class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Asistente de Arritmias</p>
            </div>
            <button onclick="nav.reset()" class="text-sm font-semibold text-blue-600 px-3 py-1 rounded-full hover:bg-blue-50">
                Reiniciar
            </button>
        </div>
        <div class="w-full bg-slate-100 h-1.5 overflow-hidden">
            <div id="progress-bar" class="progress-bar h-full bg-blue-500 w-0"></div>
        </div>
    </header>

    <main class="flex-1 max-w-2xl mx-auto w-full p-5 overflow-y-auto">
        
        <!-- Vista de Pasos -->
        <div id="view-step" class="fade-in">
            <div class="flex items-center gap-2 mb-2">
                <span id="step-number" class="text-[11px] font-black bg-blue-100 text-blue-700 px-2 py-0.5 rounded-md uppercase tracking-wider">Paso 1</span>
                <button id="back-btn" onclick="nav.back()" class="hidden text-xs font-semibold text-slate-500 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    Atrás
                </button>
            </div>
            <h2 id="question" class="text-2xl font-bold text-slate-800 mb-6 leading-tight"></h2>
            <div id="options" class="space-y-3">
                <!-- Los botones se insertan aquí vía JS -->
            </div>
        </div>

        <!-- Vista de Resultados -->
        <div id="view-result" class="hidden fade-in space-y-6">
            <div class="bg-white rounded-3xl border-2 border-blue-500 p-8 text-center shadow-xl shadow-blue-100">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </div>
                <p class="text-sm font-bold text-blue-600 uppercase tracking-widest mb-2">Origen Probable</p>
                <h2 id="final-result" class="text-3xl font-extrabold text-slate-900 mb-6 leading-tight"></h2>
                
                <div class="bg-slate-50 rounded-2xl p-4 mb-8 text-left">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Resumen de Criterios</p>
                    <div id="summary-path" class="text-sm text-slate-600 space-y-1">
                        <!-- Resumen del camino elegido -->
                    </div>
                </div>

                <button onclick="nav.reset()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-transform">
                    Nuevo Análisis
                </button>
            </div>
        </div>

    </main>

    <footer class="p-5 safe-bottom max-w-2xl mx-auto w-full">
        <a id="wa-link" href="#" target="_blank" class="flex items-center justify-center gap-3 bg-[#25D366] text-white p-4 rounded-2xl font-bold shadow-md hover:opacity-90 transition-opacity">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
            </svg>
            Contactar al Dr. Maldonado
        </a>
        <p class="text-[10px] text-center text-slate-400 mt-4">
            Herramienta de apoyo diagnóstico. No reemplaza el juicio clínico.
        </p>
    </footer>

    <script>
        const tree = {
            start: { 
                t: "¿Cuál es la morfología dominante en V1?", 
                o: [
                    {l: "BRI (Negativo / QS - rS)", n: "bri", text: "Morfología de Bloqueo de Rama Izquierda (BRI)"},
                    {l: "BRD (Positivo / R - Rs)", n: "brd", text: "Morfología de Bloqueo de Rama Derecha (BRD)"}
                ]
            },
            // RAMA BRI
            bri: { 
                t: "Evaluación de Cara Inferior (DII, DIII, aVF)", 
                o: [
                    {l: "Positiva (+)", n: "bri_p", text: "Eje en Cara Inferior Positivo (+)"},
                    {l: "Negativa (-)", n: "bri_n", text: "Eje en Cara Inferior Negativo (-)"},
                    {l: "Eje Mix (DII+ / DIII-)", n: "bri_m", text: "Eje Inferior Mixto (DII+ / DIII-)"}
                ]
            },
            bri_p: { 
                t: "Criterio de Derivación DI", 
                o: [
                    {l: "DI (+) y DII > DIII", n: "bri_p_l", text: "Derivación DI (+) con DII > DIII"},
                    {l: "DI (-) y DIII > DII", n: "bri_p_r", text: "Derivación DI (-) con DIII > DII"}
                ]
            },
            bri_p_l: { 
                t: "Punto de Transición en Precordiales", 
                o: [
                    {l: "Temprana (< V2)", r: "Seno Coronariano Derecho - TSVD PosteroSuperior", text: "Transición Precordial Temprana (< V2)"},
                    {l: "Intermedia (V2-V3)", n: "bri_avl", text: "Transición Precordial Intermedia (V2-V3)"},
                    {l: "Tardía (> V4)", r: "Tracto de Salida VD (Posterior)", text: "Transición Precordial Tardía (> V4)"}
                ]
            },
            bri_avl: { 
                t: "Morfología en aVL", 
                o: [
                    {l: "aVL Positiva (+)", r: "Región Parahisiana - TSVD PosteroInferior", text: "Morfología en aVL Positiva (+)"},
                    {l: "aVL Negativa (-)", r: "Seno Coronariano Derecho - TSVD PosteroSuperior", text: "Morfología en aVL Negativa (-)"}
                ]
            },
            bri_p_r: { 
                t: "Punto de Transición en Precordiales", 
                o: [
                    {l: "Temprana (< V2)", n: "bri_sp", text: "Transición Precordial Temprana (< V2)"},
                    {l: "Tardía (> V3)", r: "Tracto de Salida VD (Anterior)", text: "Transición Precordial Tardía (> V3)"}
                ]
            },
            bri_sp: { 
                t: "Signos Específicos", 
                o: [
                    {l: "Pseudo Delta", r: "Summit Ventrículo Izquierdo", text: "Presencia de Pseudo Delta"},
                    {l: "r con muesca en V1", r: "Seno Coronariano Izquierdo", text: "Morfología r con muesca en V1"}
                ]
            },
            bri_n: { 
                t: "Transición en Precordiales", 
                o: [
                    {l: "Temprana (< V3)", r: "Septal / Anillo Tricuspídeo Septal", text: "Transición Precordial Temprana (< V3)"},
                    {l: "Tardía (> V4)", r: "Banda Moderadora / Anillo Tricuspídeo Pared Libre", text: "Transición Precordial Tardía (> V4)"}
                ]
            },
            bri_m: { 
                t: "Transición en Precordiales", 
                o: [
                    {l: "V2 - V3", r: "Región Parahisiana - TSVD PosteroInferior", text: "Transición Precordial en V2-V3"},
                    {l: "Tardía (> V4)", n: "bri_v1_f", text: "Transición Precordial Tardía (> V4)"}
                ]
            },
            bri_v1_f: { 
                t: "Morfología Detallada en V1", 
                o: [
                    {l: "Tipo rS", r: "Anillo Tricuspídeo Lateral", text: "Morfología V1 tipo rS"},
                    {l: "Tipo QS", r: "Banda Moderadora", text: "Morfología V1 tipo QS"}
                ]
            },
            // RAMA BRD
            brd: { 
                t: "Evaluación de Cara Inferior (DII, DIII, aVF)", 
                o: [
                    {l: "Positiva (+)", n: "brd_p", text: "Eje en Cara Inferior Positivo (+)"},
                    {l: "Negativa (-)", n: "brd_n", text: "Eje en Cara Inferior Negativo (-)"},
                    {l: "DII(-) / DIII(+)", n: "brd_s", text: "Eje DII(-) y DIII(+)"}
                ]
            },
            brd_p: { 
                t: "Transición en Precordiales", 
                o: [
                    {l: "V3 - V4", n: "brd_p_q", text: "Transición Precordial en V3-V4"},
                    {l: "Tardía (> V5)", r: "Anillo Mitral Lateral", text: "Transición Precordial Tardía (> V5)"}
                ]
            },
            brd_p_q: { 
                t: "Duración del QRS", 
                o: [
                    {l: "Estrecho (< 140ms)", r: "TV Fascicular Anterior (TVFA)", text: "Complejo QRS Estrecho (< 140ms)"},
                    {l: "Ancho (> 140ms)", r: "Músculo Papilar Anterior (MPA)", text: "Complejo QRS Ancho (> 140ms)"}
                ]
            },
            brd_n: { 
                t: "Transición en Precordiales", 
                o: [
                    {l: "V3 - V4", n: "brd_n_q", text: "Transición Precordial en V3-V4"},
                    {l: "Tardía (> V5)", r: "Anillo Mitral Posterior (AMP)", text: "Transición Precordial Tardía (> V5)"}
                ]
            },
            brd_n_q: { 
                t: "Duración del QRS", 
                o: [
                    {l: "Estrecho (< 140ms)", r: "TV Fascicular Posterior (TVFP)", text: "Complejo QRS Estrecho (< 140ms)"},
                    {l: "Ancho (> 140ms)", r: "Músculo Papilar Posterior (MPP)", text: "Complejo QRS Ancho (> 140ms)"}
                ]
            },
            brd_s: { 
                t: "Transición en Precordiales", 
                o: [
                    {l: "Temprana (< V4)", r: "Músculo Papilar Anterior (MPA)", text: "Transición Precordial Temprana (< V4)"},
                    {l: "Tardía (> V5)", r: "Anillo Mitral Lateral", text: "Transición Precordial Tardía (> V5)"}
                ]
            }
        };

        const nav = {
            curr: 'start',
            hist: [], // Almacena los nodos previos para permitir "Atrás"
            pathText: [], // Almacena las etiquetas para el resumen final

            init() {
                const wa = document.getElementById('wa-link');
                const msg = encodeURIComponent("Hola Dr. Maldonado, utilicé la app EKG Locator para un análisis y quería consultarle sobre un caso...");
                wa.href = `https://wa.me/541132852520?text=${msg}`;
                this.render();
            },

            render() {
                const step = tree[this.curr];
                const viewStep = document.getElementById('view-step');
                const viewResult = document.getElementById('view-result');
                const optionsDiv = document.getElementById('options');
                const backBtn = document.getElementById('back-btn');
                const progressBar = document.getElementById('progress-bar');
                
                // Actualizar UI de pasos
                viewStep.classList.remove('hidden');
                viewResult.classList.add('hidden');
                
                document.getElementById('step-number').innerText = `PASO ${this.hist.length + 1}`;
                document.getElementById('question').innerText = step.t;
                
                // Botón atrás
                backBtn.style.display = this.hist.length > 0 ? 'flex' : 'none';

                // Calcular progreso estimado (basado en profundidad promedio del árbol ~4 pasos)
                const progressWidth = Math.min((this.hist.length / 4) * 100, 90);
                progressBar.style.width = `${progressWidth}%`;

                // Renderizar opciones
                optionsDiv.innerHTML = '';
                step.o.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'card-btn w-full bg-white p-5 rounded-2xl flex justify-between items-center text-left font-semibold text-slate-700 shadow-sm hover:border-blue-300';
                    btn.innerHTML = `
                        <span>${opt.l}</span>
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    `;
                    btn.onclick = () => this.go(opt.n, opt.r, opt.text);
                    optionsDiv.appendChild(btn);
                });
            },

            go(nextNode, result, label) {
                // Guardar rastro
                this.pathText.push(label);
                
                if (result) {
                    this.showResult(result);
                } else {
                    this.hist.push(this.curr);
                    this.curr = nextNode;
                    this.render();
                }
            },

            back() {
                if (this.hist.length > 0) {
                    this.curr = this.hist.pop();
                    this.pathText.pop();
                    this.render();
                }
            },

            showResult(result) {
                document.getElementById('view-step').classList.add('hidden');
                document.getElementById('view-result').classList.remove('hidden');
                document.getElementById('final-result').innerText = result;
                document.getElementById('progress-bar').style.width = '100%';
                
                // Generar resumen
                const summaryDiv = document.getElementById('summary-path');
                summaryDiv.innerHTML = this.pathText.map((txt, i) => `
                    <div class="flex items-start gap-2">
                        <span class="text-blue-500 font-bold">•</span>
                        <span>${txt}</span>
                    </div>
                `).join('');
            },

            reset() {
                this.curr = 'start';
                this.hist = [];
                this.pathText = [];
                this.render();
            }
        };

        // Iniciar App
        window.onload = () => nav.init();
    </script>
</body>
</html>
